<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Te Amo!</title>
  <style>
    body {
      background-color: #eedee3;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 50px;
      color: #df98d9d2;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    p {
      font-size: 22px;
      max-width: 700px;
      margin: auto;
      line-height: 1.6;
    }
    .hearts {
      font-size: 40px;
      animation: float 2s infinite ease-in-out;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="hearts">💖💗💞💕</div>
  <h1>¡Sabía que dirías que sí! ❤️</h1>
  <p>
    Ahora que eres mi novia, quiero prometerte algo:<br><br>
    Siempre voy a cuidarte, escucharte, apoyarte en todo momento y hacerte reír incluso en los días grises.<br>
    No será perfecto, pero siempre será contigo. Te amo con todo mi corazón. 🥰
  </p>
  <div class="hearts">💖💗💞💕</div>

</body>
</html>
